# QA Stage 2: COT Reasoning (NL + FOL → answer + explanation)
# Usage: python -m models.QA_model.train --config configs/qa_model.yaml

model:
  name: Qwen/Qwen3.5-4B
  trust_remote_code: true
  max_seq_length: 3000
  # reasoning steps + JSON cuối (answer LAST). Vì answer ở cuối, cắt sớm = MẤT answer.
  # Phân phối assistant target: P95~480, P99~600, max~793 token → 768 phủ ~99.x% an toàn.
  gen_max_new_tokens: 1000

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

training:
  # Số mẫu TRAIN dùng để chạy thử nhanh (chỉ cắt split train; dev/test giữ nguyên).
  # null = train full sample. Ví dụ 50 → chỉ train 50 mẫu đầu.
  train_sample: null
  num_train_epochs: 10
  # OOM fix: logits tensor = [batch, seq_len, vocab~152k] là chỗ ngốn VRAM nhất.
  # Hạ batch → giữ effective batch = 1×8 = 8 (bằng 4×2 cũ) qua grad accumulation.
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 10
  gradient_accumulation_steps: 2
  learning_rate: 2e-5
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  bf16: true
  gradient_checkpointing: true
  train_seed: 42
  load_in_8bit: true
  # Liger kernel: fused cross-entropy KHÔNG materialize full logits → tiết kiệm
  # VRAM lớn nhất cho vocab to. Bật sau khi: pip install liger-kernel
  use_liger_kernel: false
  # Completion-only loss: chỉ tính loss trên phần assistant (JSON đáp án),
  # mask system+user. Khớp FOL train_on_responses_only.
  completion_only_loss: true
  # Early stopping
  early_stopping_patience: 4
  load_best_model_at_end: true
  metric_for_best_model: eval_accuracy
  greater_is_better: true
  save_total_limit: 2

eval:
  # Số mẫu dev tối đa để tính accuracy mỗi epoch (null = cả dev, chậm)
  eval_accuracy_max_samples: 50
  # Số mẫu random in full JSON mỗi epoch (NL, FOL, question, gold, prediction)
  eval_print_samples: 6
  # Latency benchmark sau training
  inference_latency_benchmark_n: 50
  inference_latency_warmup: 2
  inference_latency_benchmark_split: test

inference:
  # After training, set this to the merged model path or Hub repo
  model_path: null  # Will use model.name as fallback
  max_new_tokens: 768   # answer LAST → phải đủ rộng kẻo cắt mất answer (P99~600, max~793)
  load_in_8bit: true

hub:
  org: Laplaces-Red-Devils
  repo_version: v03
  type: QA
  method: CoT
  push_to_hub: true
  hf_private: true
