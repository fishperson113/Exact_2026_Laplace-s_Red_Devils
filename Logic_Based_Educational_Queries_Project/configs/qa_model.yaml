# QA Stage 2: COT Reasoning (NL + FOL → answer + explanation)
# Usage: python -m models.QA_model.train --config configs/qa_model.yaml

model:
  name: Qwen/Qwen3.5-4B
  trust_remote_code: true
  max_seq_length: 3500
  gen_max_new_tokens: 200

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

training:
  num_train_epochs: 30
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2e-5
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  bf16: true
  gradient_checkpointing: true
  train_seed: 42
  load_in_8bit: true
  # Early stopping
  early_stopping_patience: 7
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  save_total_limit: 2

eval:
  # Số mẫu dev tối đa để tính accuracy mỗi epoch (null = cả dev, chậm)
  eval_accuracy_max_samples: 40
  # Số mẫu random in full JSON mỗi epoch (NL, FOL, question, gold, prediction)
  eval_print_samples: 6
  # Latency benchmark sau training
  inference_latency_benchmark_n: 40
  inference_latency_warmup: 2
  inference_latency_benchmark_split: test

inference:
  # After training, set this to the merged model path or Hub repo
  model_path: null  # Will use model.name as fallback
  max_new_tokens: 256
  load_in_8bit: true

hub:
  org: Laplaces-Red-Devils
  repo_version: v01
  type: QA
  method: CoT
  push_to_hub: true
  hf_private: true
