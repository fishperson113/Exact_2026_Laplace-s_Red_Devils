# logic_solution/config.yaml
# Cấu hình pipeline — chỉnh model hoặc token limit tại đây

fol_model:
  hub_repo_id: Laplaces-Red-Devils/fol-v06-cot-augmented-fol-pretrain-malls-qwen3.5-4
  max_new_tokens: 768       # đủ cho JSON premises_fol nhiều mệnh đề (no-think)

qa_model:
  hub_repo_id: Laplaces-Red-Devils/v02-QA-CoT
  max_new_tokens: 256       # khớp gen_max_new_tokens lúc train QA (no-think)

inference:
  load_in_8bit: true        # true = tiết kiệm VRAM, false = nhanh hơn nếu đủ RAM
  slow_threshold_sec: 60    # cảnh báo nếu 1 sample vượt ngưỡng này (giây)
