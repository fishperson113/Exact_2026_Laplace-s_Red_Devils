# logic_solution/config.yaml
# ĐỒNG NHẤT với configs/ensemble_model.yaml (bản train/eval) — bản chất 2 cấu hình
# là MỘT (cùng pipeline FOL → QA). Chỉnh ở đây PHẢI khớp ensemble.
# KHÁC DUY NHẤT: logic_solution KHÔNG có giai đoạn push kết quả lên HF Hub.

fol_model:
  # HF Hub repo chứa FOL model đã merge
  hub_repo_id: Laplaces-Red-Devils/fol-v06-cot-augmented-fol-pretrain-malls-qwen3.5-4
  max_new_tokens: 768   # đủ cho JSON premises_fol nhiều mệnh đề (no-think)

qa_model:
  # HF Hub repo chứa LoRA adapter (base model tự đọc từ adapter_config.json)
  hub_repo_id: Laplaces-Red-Devils/v04-QA-CoT
  max_new_tokens: 1000   # khớp gen_max_new_tokens lúc train QA (no-think)

  # ── Decoding (MẶC ĐỊNH = khớp flow Ensemble khi train/eval) ─────────────────
  # Greedy (do_sample=False) + no-think, giống src/models/Ensemble_Model/inference.py.
  # Model được train no-think → giữ nguyên để inference khớp phân phối train.
  enable_thinking: false

  # ── Native thinking (Chế độ B — TÙY CHỌN, mặc định KHÔNG dùng) ──────────────
  # Chỉ bật nếu adapter đã SFT có think; bật trên adapter no-think thường ra
  # <think> rỗng. Qwen3 think mode BẮT BUỘC sampling (không greedy).
  # Bỏ comment các dòng dưới khi đổi enable_thinking: true:
  # thinking_max_new_tokens: 1024   # ngân sách token khi think (think + JSON answer)
  # temperature: 0.6                # Qwen3 thinking-mode recommended
  # top_p: 0.95
  # top_k: 20

inference:
  # KHỚP ensemble: bf16 chạy thẳng tensor core → NHANH hơn; 8-bit chỉ tiết kiệm VRAM (overhead dequant)
  load_in_8bit: false
  # Cảnh báo nếu 1 sample vượt ngưỡng này (giây)
  slow_threshold_sec: 60

  # Các knob vận hành dưới đây logic_solution hành xử CỐ ĐỊNH đúng bằng default của
  # ensemble (code đã chạy như vậy nên không cần khai báo):
  #   load_both_models: true   — nạp cả 2 model, giữ resident giữa các lượt
  #   use_fol: true            — luôn chạy đủ pipeline FOL → QA
  #   batch_size: 1            — xử lý từng query (đo latency thật, an toàn luật 60s/query)

# KHÔNG có khối `hub:` — push kết quả lên HF Hub là phần RIÊNG của ensemble (train/eval).
# logic_solution chỉ ghi output JSON ra file qua tham số --output.
