# logic_solution/config.yaml
# Cấu hình pipeline — chỉnh model hoặc token limit tại đây

fol_model:
  hub_repo_id: Laplaces-Red-Devils/fol-v06-cot-augmented-fol-pretrain-malls-qwen3.5-4
  max_new_tokens: 768       # đủ cho JSON premises_fol nhiều mệnh đề (no-think)

qa_model:
  hub_repo_id: Laplaces-Red-Devils/v02-QA-CoT
  # QA v3: reasoning steps + JSON cuối, answer ĐỨNG CUỐI → cắt sớm = MẤT answer.
  # Phân phối assistant target: P95~480, P99~600, max~793 token → 1000 an toàn
  # (khớp gen_max_new_tokens trong configs/qa_model.yaml lúc train).
  max_new_tokens: 1000

  # ── Native thinking (Chế độ B) ──────────────────────────────────────────────
  # enable_thinking=true → stage 2 sinh <think>…</think> CoT rồi mới ra JSON.
  # LƯU Ý: muốn think THẬT phải dùng adapter đã SFT có think; bật trên adapter
  # no-think thường ra <think> rỗng. Qwen3 think mode BẮT BUỘC sampling (không greedy).
  enable_thinking: false
  thinking_max_new_tokens: 1024   # ngân sách token khi think (think + JSON answer)
  temperature: 0.6                # Qwen3 thinking-mode recommended
  top_p: 0.95
  top_k: 20

inference:
  load_in_8bit: true        # true = tiết kiệm VRAM, false = nhanh hơn nếu đủ RAM
  slow_threshold_sec: 60    # cảnh báo nếu 1 sample vượt ngưỡng này (giây)
